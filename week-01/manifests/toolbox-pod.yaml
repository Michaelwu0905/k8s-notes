apiVersion: v1
kind: Pod
metadata:
  name: toolbox
  namespace: cka-w1
  labels:
    app: toolbox
spec:
  containers:
    - name: toolbox
      image: busybox:1.37.0
      imagePullPolicy: IfNotPresent
      command: ["sh", "-c", "sleep 86400"]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
        limits:
          cpu: 100m
          memory: 32Mi
